<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dein Zugang | Beziehungsdynamiken</title>
<style>
:root{--cream:#FFF7ED;--sand:#F5E6D3;--terr:#C96B4B;--brown:#2F2623;--muted:#5F504A;--line:#E8D2BE}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
nav{border-bottom:1px solid var(--line);background:rgba(255,247,237,.97)}.navin{max-width:960px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;font-weight:800}.brand img{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;padding:4px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
main{max-width:900px;margin:auto;padding:56px 20px 90px}h1{font-family:Georgia,serif;font-size:48px;margin:0 0 10px}.lead{color:var(--muted);line-height:1.6;margin-bottom:30px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:18px}.credit{display:flex;justify-content:space-between;gap:20px;align-items:center;border-top:1px solid var(--line);padding:17px 0}.credit:first-child{border-top:0}.big{font-size:28px;font-weight:850}.muted{color:var(--muted)}.btn{display:inline-block;background:var(--terr);color:white;text-decoration:none;padding:11px 15px;border-radius:12px;font-weight:800}.material{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line)}.material:first-child{border-top:0}.material a{color:#A9543B;font-weight:800;text-decoration:none}.err{background:#fff0ef;border:1px solid #e9c1bd;padding:15px;border-radius:14px;color:#7b2f28}
</style></head><body>
<nav><div class="navin"><a class="brand" href="index.html"><img src="./public/Beziehungsdynmiken_logo_colour.png" alt=""><span>Beziehungsdynamiken<small>mit Theophil Kroller</small></span></a></div></nav>
<main><h1>Dein Zugang</h1><p class="lead">Deine Packages, verfügbaren Sitzungen und Materialien an einem Ort.</p><div id="status">Lade …</div><div id="content" hidden><div class="card"><h2>Verfügbare Sitzungen</h2><div id="credits"></div></div><div class="card"><h2>Materialien</h2><div id="materials"></div></div></div></main>
<script src="./booking-config.js"></script><script>
const API=(window.BOOKING_CONFIG||{}).apiBaseUrl||"https://beziehungsdynamiken-booking.theophil-kroller.workers.dev";
const token=new URLSearchParams(location.search).get("token")||"";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){
 if(!token){document.getElementById("status").innerHTML='<div class="err">Dieser Zugangslink ist ungültig oder abgelaufen.</div>';return}
 const r=await fetch(API.replace(/\/$/,"")+"/package-access?token="+encodeURIComponent(token));const d=await r.json();
 if(!r.ok||!d.ok){document.getElementById("status").innerHTML='<div class="err">Dieser Zugangslink ist ungültig oder abgelaufen.</div>';return}
 document.getElementById("status").hidden=true;document.getElementById("content").hidden=false;
 const cw=document.getElementById("credits");cw.innerHTML="";
 d.credits.forEach(c=>{
   const row=document.createElement("div");row.className="credit";
   const name=c.name_de;
   row.innerHTML=`<div><strong>${esc(name)}</strong><div class="muted">${c.session_minutes} Min.</div></div><div style="text-align:right"><div class="big">${c.remaining} / ${c.total}</div><a class="btn" href="booking.html?type=${encodeURIComponent(c.session_type)}&package_token=${encodeURIComponent(token)}">Sitzung aus Guthaben buchen</a></div>`;
   cw.appendChild(row);
 });
 const mw=document.getElementById("materials");mw.innerHTML="";
 if(!d.materials.length) mw.innerHTML='<p class="muted">Noch keine Materialien hinterlegt.</p>';
 d.materials.forEach(m=>{
   const row=document.createElement("div");row.className="material";
   const title=m.title_de;
   row.innerHTML=`<span>${esc(title)}</span><a href="${API.replace(/\/$/,"")}/material?token=${encodeURIComponent(token)}&id=${m.id}" target="_blank" rel="noopener">Öffnen →</a>`;
   mw.appendChild(row);
 });
}
load();
</script></body></html>
