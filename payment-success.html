<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Zahlung | Beziehungsdynamiken</title><style>
:root{--cream:#FFF7ED;--sand:#F5E6D3;--terr:#C96B4B;--brown:#2F2623;--muted:#6F5F58;--line:#E8D2BE}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:8px;background:var(--brown)}nav{border-bottom:1px solid var(--line)}.navin{max-width:1060px;margin:auto;padding:18px 20px;display:flex;align-items:center;gap:12px;font-size:22px;font-weight:850}.navin img{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;padding:4px}.navin small{display:block;font-size:12px;font-weight:500;color:var(--muted)}main{min-height:72vh;display:grid;place-items:center;padding:40px 18px}.box{max-width:720px;width:100%;background:#fff;border:1px solid var(--line);border-radius:26px;padding:42px;text-align:center;box-shadow:0 18px 50px rgba(47,38,35,.06)}h1{font:700 clamp(34px,6vw,52px)/1.05 Georgia,serif;margin:0 0 16px}.status{color:var(--muted);line-height:1.65;font-size:17px}.spin{width:34px;height:34px;border:3px solid var(--sand);border-top-color:var(--terr);border-radius:50%;margin:24px auto;animation:r .9s linear infinite}@keyframes r{to{transform:rotate(360deg)}}a{color:#A9543B;font-weight:800}.ok{font-size:42px;margin-bottom:12px}@media(max-width:600px){.box{padding:28px 20px}}
</style></head><body><div class="top"></div><nav><div class="navin"><img src="./public/Beziehungsdynmiken_logo_colour.png" alt=""><span>Beziehungsdynamiken<small>mit Theophil Kroller</small></span></div></nav><main><section class="box"><div id="icon" class="spin"></div><h1 id="title">Zahlung wird verarbeitet</h1><div id="status" class="status">Einen Moment bitte. Rechnung und Zugang werden automatisch fertiggestellt.</div></section></main><script>
const API='https://beziehungsdynamiken-booking.theophil-kroller.workers.dev',q=new URLSearchParams(location.search),sid=q.get('session_id'),cancelled=q.get('cancelled');const title=document.getElementById('title'),status=document.getElementById('status'),icon=document.getElementById('icon');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const POLL_DELAYS=[0,2000,5000,10000,20000,30000];let running=false;
function done(t,html){icon.className='ok';icon.textContent='✓';title.textContent=t;status.innerHTML=html}
async function waitVisible(){while(document.hidden)await sleep(1000)}
async function run(){if(running)return;running=true;try{if(cancelled){icon.className='ok';icon.textContent='↩';title.textContent='Zahlung abgebrochen';status.innerHTML='Es wurde nichts belastet.<br><br><a href="angebote.html">Zurück zu den Angeboten →</a>';return}if(!sid){title.textContent='Zahlungsstatus nicht gefunden';status.textContent='Der Zahlungslink ist unvollständig.';icon.remove();return}for(let i=0;i<POLL_DELAYS.length;i++){if(POLL_DELAYS[i])await sleep(POLL_DELAYS[i]);await waitVisible();try{const r=await fetch(API+'/sales/payment-status?session_id='+encodeURIComponent(sid),{cache:'no-store'}),x=await r.json().catch(()=>({}));if(r.ok&&x.ok&&!x.pending&&(x.status==='active'||x.status==='paid')){const href=x.accessToken?'zugang.html?token='+encodeURIComponent(x.accessToken):'index.html';done(x.kind==='subscription'?'Kontinuitätsmodell eingerichtet':'Zahlung erhalten',`Zahlung, Rechnung und Freischaltung wurden automatisch verbucht. Eine Bestätigungsmail wurde versandt.<br><br><a href="${href}">Persönlichen Bereich & PDF-Rechnung öffnen →</a><br><br><a href="index.html">Zurück zur Website →</a>`);return}if(!r.ok&&r.status!==202)throw new Error(x.error||'Fehler')}catch(e){/* bounded retry only */}}icon.className='ok';icon.textContent='⏳';title.textContent='Zahlung erhalten';status.innerHTML='Die Verbuchung dauert länger als üblich. Um Cloud-Ressourcen zu schonen, wurde die automatische Prüfung beendet.<br><br><button id="manualCheck" type="button" style="border:0;border-radius:10px;padding:11px 15px;background:#C96B4B;color:white;font-weight:800;cursor:pointer">Status jetzt prüfen</button><br><br><a href="index.html">Zurück zur Website →</a>';document.getElementById('manualCheck')?.addEventListener('click',()=>{running=false;icon.className='spin';icon.textContent='';title.textContent='Zahlungsstatus wird geprüft';status.textContent='Einen Moment bitte …';run()},{once:true})}finally{running=false}}run();
</script><script src="site-profile.js?v=20260922-build13-6-2"></script></body></html>
