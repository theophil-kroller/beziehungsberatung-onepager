<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart | Beziehungsdynamiken</title>
<meta name="robots" content="noindex">
<style>
:root{--cream:#FFF7ED;--sand:#F5E6D3;--terr:#C96B4B;--terr2:#A9543B;--brown:#2F2623;--muted:#5F504A;--line:#E8D2BE}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
nav{position:sticky;top:0;background:rgba(255,247,237,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20}
.navin{max-width:1050px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;text-decoration:none;font-size:20px;color:var(--brown)}.brand:visited{color:var(--brown)}.brand img{width:46px;height:46px;border-radius:50%;object-fit:contain;background:var(--cream);border:1px solid var(--line);padding:4px}.brand-copy{line-height:1.08}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:5px}
.lang{border:1px solid var(--line);border-radius:11px;padding:9px 12px;text-decoration:none;color:var(--muted);font-weight:700}
main{max-width:900px;margin:auto;padding:62px 20px 90px}
.eyebrow{color:var(--terr);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:13px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,7vw,68px);margin:10px 0 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 18px 55px rgba(47,38,35,.06)}
.empty{padding:32px 8px;text-align:center}.empty h2{font-family:Georgia,serif;font-size:29px;margin:0 0 9px}.empty p{color:var(--muted);line-height:1.65;max-width:570px;margin:0 auto 22px}
.btn{display:inline-block;border:0;border-radius:13px;padding:12px 17px;text-decoration:none;font-weight:800;cursor:pointer}.primary{background:var(--terr);color:#fff}.primary:hover{background:var(--terr2)}.secondary{background:var(--sand);color:var(--brown)}
.item{display:grid;grid-template-columns:1fr auto;gap:18px;padding:19px 0;border-bottom:1px solid var(--line)}.item:first-child{padding-top:0}.item h3{margin:0 0 5px;font-size:18px}.meta{color:var(--muted);font-size:14px;line-height:1.5}.price{font-weight:850;white-space:nowrap}.remove{border:0;background:none;color:var(--terr2);padding:7px 0;cursor:pointer;font-weight:700}
.summary{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.sum-label{color:var(--muted)}.sum-price{font-size:24px;font-weight:850}
.checkout-row{margin-top:18px;display:flex;justify-content:flex-end}.note{margin-top:14px;color:var(--muted);font-size:13px;text-align:right}
@media(max-width:600px){.item{grid-template-columns:1fr}.price{justify-self:start}.summary{align-items:flex-end}}

.checkout-box{margin-top:22px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--cream)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.fields input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}
.checkout-msg{margin-top:12px;font-size:14px}.checkout-msg.err{color:#7b2f28}@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="navin"><a class="brand" href="en.html"><img src="./public/Beziehungsdynmiken_logo_colour.png" alt=""><span class="brand-copy">Beziehungsdynamiken<small>mit Theophil Kroller</small></span></a><a class="lang" href="cart.html">DE</a></div></nav>
<main>
<div class="eyebrow">Your selection</div><h1>Cart</h1>
<div class="card">
  <div id="empty" class="empty" hidden>
    <h2>Your cart is still empty.</h2>
    <p>Packages and other offers can be collected here and paid together.</p>
    <a href="offers.html" class="btn primary">Back to offers</a>
  </div>
  <div id="filled" hidden>
    <div id="items"></div>
    <div class="summary"><span class="sum-label">Subtotal</span><span class="sum-price" id="subtotal">€0,00</span></div>
    <div class="checkout-box" id="testCheckoutBox" hidden>
<h3>Test checkout · €0,00</h3>
<p class="meta">No payment will be charged.</p>
<div class="fields"><div><label>Name</label><input id="checkoutName"></div><div><label>Email</label><input id="checkoutEmail" type="email"></div></div>
<div class="checkout-msg" id="checkoutMsg"></div></div>
<div class="checkout-row"><button class="btn primary" id="checkout" type="button">Complete test purchase – €0.00</button></div>
    <div class="note">Mollie checkout will be connected in the next step.</div>
  </div>
</div>
</main>
<script src="./cart.js"></script>
<script>
const money = n => new Intl.NumberFormat("en-AT",{style:"currency",currency:"EUR"}).format(Number(n||0));
function renderCart(){
 let items=BDCart.get();
 let migrated=false;
 items=items.map(item=>{
   if(item.id==="poly-starter" && (item.price===null || item.price===undefined || item.price==="")){
     migrated=true;
     return {...item,price:0,testCheckout:true};
   }
   return item;
 });
 if(migrated) localStorage.setItem("bd_cart_v1",JSON.stringify(items));
 const empty=document.getElementById("empty"), filled=document.getElementById("filled"), wrap=document.getElementById("items");
 empty.hidden=items.length>0; filled.hidden=items.length===0; wrap.innerHTML="";
 let subtotal=0;
 items.forEach(item=>{
   const qty=Math.max(1,Number(item.qty||1)), hasPrice=item.price!==null && item.price!==undefined && item.price!=="" && !Number.isNaN(Number(item.price)), price=hasPrice?Number(item.price):0; if(hasPrice) subtotal+=qty*price;
   const key=item.id||item.sku||item.name;
   const row=document.createElement("div"); row.className="item";
   row.innerHTML=`<div><h3>${escapeHtml(item.name||"Package")}</h3><div class="meta">${escapeHtml(item.description||"")}${item.advisor?` · Counsellor: ${escapeHtml(item.advisor)}`:""}${qty>1?` · ×${qty}`:""}</div><button class="remove" type="button">Remove</button></div><div class="price">${hasPrice?money(qty*price):"Price to follow"}</div>`;
   row.querySelector(".remove").onclick=()=>{BDCart.remove(key);renderCart();};
   wrap.appendChild(row);
 });
 document.getElementById("subtotal").textContent=money(subtotal);
 const missingPrice=items.some(item=>item.price===null || item.price===undefined || item.price==="");
 const testEligible=items.length===1 && items[0].id==="poly-starter" && Number(items[0].price)===0;
 const checkout=document.getElementById("checkout");
 checkout.disabled=missingPrice || !testEligible;
 const box=document.getElementById("testCheckoutBox"); if(box) box.hidden=!testEligible;
 checkout.style.opacity=(missingPrice||!testEligible)?".45":"1";
 checkout.style.cursor=(missingPrice||!testEligible)?"not-allowed":"pointer";
 checkout.title=missingPrice?"Checkout will be activated once prices are set and Mollie is connected.":"";
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
document.getElementById("checkout").onclick=async()=>{
 const items=BDCart.get(),msg=document.getElementById("checkoutMsg"),name=document.getElementById("checkoutName")?.value.trim(),email=document.getElementById("checkoutEmail")?.value.trim();
 if(!(items.length===1&&items[0].id==="poly-starter"&&Number(items[0].price)===0))return;
 if(!name||!email){msg.className="checkout-msg err";msg.textContent='Please enter name and email.';return;}
 try{const r=await fetch("https://beziehungsdynamiken-booking.theophil-kroller.workers.dev/test-checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,productId:"poly-starter"})});const x=await r.json();if(!r.ok||!x.ok)throw new Error(x.error||"failed");BDCart.clear();location.href="access.html?token="+encodeURIComponent(x.accessToken);}
 catch(e){msg.className="checkout-msg err";msg.textContent=e.message;}
};
window.addEventListener("bd-cart-updated",renderCart);renderCart();
</script>
</body></html>
